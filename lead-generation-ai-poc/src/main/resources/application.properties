spring.application.name=lead-generation-ai-poc
server.port=8080

# ---- H2 (in-memory; data resets on every restart) ----
spring.datasource.url=jdbc:h2:mem:leadgendb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# H2 console: http://localhost:8080/h2-console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ---- AI engine ----
# rule   = built-in rule-based scoring (works offline, no key needed)
# claude = calls the Anthropic Messages API, falls back to rule-based if the call fails
ai.provider=rule
ai.claude.api-key=${ANTHROPIC_API_KEY:}
ai.claude.model=claude-sonnet-5-5
ai.claude.max-tokens=800
ai.claude.base-url=https://api.anthropic.com

# ---- Demo data ----
app.seed.enabled=true
